<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Agent</title>
<style>
  :root {
    --bg: #0f1117;
    --sidebar-bg: #161b22;
    --input-bg: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --user-bubble: #3b4cc0;
    --agent-bubble: #21262d;
    --user-text: #ffffff;
    --agent-text: #e6edf3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100%; display: flex; flex-direction: column; }
  .header { background: var(--sidebar-bg); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .btn-clear:hover { background: var(--border); color: var(--text); }
  .main { flex: 1; display: flex; overflow: hidden; }
  .sidebar { width: 220px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px 16px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .history-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .history-item { padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .history-item:hover { background: #21262d; color: var(--text); }
  .history-empty { padding: 16px; font-size: 12px; color: var(--text-dim); text-align: center; }
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.agent .avatar { background: var(--border); color: var(--text-dim); }
  .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--agent-text); }
  .msg.user .bubble { background: var(--user-bubble); border-color: var(--user-bubble); color: var(--user-text); }
  .loading { display: flex; gap: 10px; align-items: center; color: var(--text-dim); font-size: 13px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .input-area { padding: 12px 20px 16px; background: var(--sidebar-bg); border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }
  .input-area input { flex: 1; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
  .input-area input:focus { border-color: var(--accent); }
  .input-area input::placeholder { color: var(--text-dim); }
  .btn-send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
  .btn-send:hover { background: var(--accent-hover); }
  .btn-send:disabled { background: var(--border); cursor: not-allowed; }
  .welcome { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <h1>M-Agent</h1>
  <div class="header-actions">
    <button class="btn-clear" onclick="clearHistory()">New Chat</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">History</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No history yet</div>
    </div>
  </div>
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome">
        <h2>你好，我是 M-Agent</h2>
        <p>我能帮你写代码、审查代码、修复bug，也可以聊聊</p>
      </div>
    </div>
    <div class="input-area">
      <input id="prompt" placeholder="输入你的任务..." onkeydown="if(event.key==='Enter' && !event.shiftKey)send()">
      <button class="btn-send" id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<script>
  var SESSION_KEY = 'magent_session';
  var HISTORY_KEY = 'magent_history';
  var currentSession = localStorage.getItem(SESSION_KEY) || null;
  var loading = false;

  var messagesEl = document.getElementById('messages');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('sendBtn');

  function loadHistory() {
    var list = document.getElementById('historyList');
    var all = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    var keys = Object.keys(all).reverse();
    if (keys.length === 0) {
      list.innerHTML = '<div class="history-empty">No history yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < keys.length; i++) {
      html += '<div class="history-item" onclick="loadSession(\'' + keys[i] + '\')">' + escapeHtml(all[keys[i]].title || keys[i]) + '</div>';
    }
    list.innerHTML = html;
  }

  function loadSession(id) {
    var all = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    var sess = all[id];
    if (!sess) return;
    localStorage.setItem(SESSION_KEY, id);
    currentSession = id;
    renderMessages(sess.messages);
  }

  function renderMessages(msgs) {
    messagesEl.innerHTML = '';
    if (!msgs || msgs.length === 0) {
      showWelcome();
      return;
    }
    for (var i = 0; i < msgs.length; i++) {
      addMessage(msgs[i].role, msgs[i].content, false);
    }
  }

  function showWelcome() {
    messagesEl.innerHTML = '<div class="welcome"><h2>你好，我是 M-Agent</h2><p>我能帮你写代码、审查代码、修复bug，也可以聊聊</p></div>';
  }

  function saveMessage(role, content) {
    var all = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!currentSession) {
      currentSession = Date.now().toString();
      localStorage.setItem(SESSION_KEY, currentSession);
    }
    if (!all[currentSession]) all[currentSession] = { title: '', messages: [] };
    all[currentSession].messages.push({ role: role, content: content });
    if (role === 'user' && !all[currentSession].title) {
      all[currentSession].title = content.slice(0, 30);
    }
    localStorage.setItem(HISTORY_KEY, JSON.stringify(all));
    loadHistory();
  }

  function clearHistory() {
    localStorage.removeItem(SESSION_KEY);
    currentSession = null;
    showWelcome();
    loadHistory();
  }

  function escapeHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function addMessage(role, content, save) {
    save = save !== false;
    var welcome = messagesEl.querySelector('.welcome');
    if (welcome) messagesEl.removeChild(welcome);
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="avatar">' + (role === 'user' ? 'U' : 'M') + '</div><div class="bubble">' + escapeHtml(content) + '</div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if (save) saveMessage(role, content);
  }

  function setLoading(on) {
    loading = on;
    sendBtn.disabled = on;
    sendBtn.textContent = on ? '思考中...' : '发送';
  }

  function showLoading() {
    var div = document.createElement('div');
    div.className = 'msg agent';
    div.id = 'loadingMsg';
    div.innerHTML = '<div class="avatar">M</div><div class="bubble"><div class="loading"><div class="spinner"></div>思考中...</div></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeLoading() {
    var el = document.getElementById('loadingMsg');
    if (el) messagesEl.removeChild(el);
  }

  function appendToBubble(bubble, text) {
    bubble.textContent += text;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function send() {
    var text = promptEl.value.trim();
    if (!text || loading) return;
    // 立即锁死，防止重复点击
    setLoading(true);
    promptEl.value = '';
    addMessage('user', text);
    showLoading();

    try {
      var body = { prompt: text };
      if (currentSession) body.session_id = currentSession;
      var res = await fetch('/execute/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      // Create agent bubble for streaming
      var agentDiv = document.createElement('div');
      agentDiv.className = 'msg agent';
      agentDiv.innerHTML = '<div class="avatar">M</div><div class="bubble" id="agentBubble"></div>';
      messagesEl.appendChild(agentDiv);
      removeLoading();
      var bubble = document.getElementById('agentBubble');

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var reply = '';

      while (true) {
        var result = await reader.read();
        if (result.done) break;
        buffer += decoder.decode(result.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.slice(0, 6) !== 'data: ') continue;
          var data = line.slice(6);
          if (data === '[DONE]') continue;
          if (data.startsWith('[ERROR]')) {
            bubble.textContent += '\n[Error: ' + data.slice(7) + ']';
            break;
          }
          var decoded = data.replace(/\\\\n/g, '\n').replace(/\\n/g, '\n');
          appendToBubble(bubble, decoded);
          reply += decoded;
        }
      }

      if (reply) saveMessage('agent', reply);

    } catch (e) {
      removeLoading();
      var errDiv = document.createElement('div');
      errDiv.className = 'msg agent';
      errDiv.innerHTML = '<div class="avatar">M</div><div class="bubble" style="color:#f87171">Error: ' + escapeHtml(e.message) + '</div>';
      messagesEl.appendChild(errDiv);
    }

    setLoading(false);
    loadHistory();
  }

  loadHistory();
  promptEl.focus();
</script>
</body>
</html>

# AgentM CI/CD 流水线
# GitHub Actions 配置

name: AgentM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一早上 8 点运行完整测试
    - cron: '0 0 * * 1'

jobs:
  # ============================================
  # 代码质量检查
  # ============================================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pyyaml

      - name: Flake8 风格检查
        run: |
          flake8 src/ config/ --max-line-length=120 --ignore=E501,W503

      - name: Black 格式检查
        run: |
          black --check src/ config/

      - name: Isort 导入排序检查
        run: |
          isort --check-only src/ config/

      - name: Mypy 类型检查
        run: |
          mypy src/ config/ --ignore-missing-imports --no-strict-optional

  # ============================================
  # 单元测试
  # ============================================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-async pytest-cov

      - name: 运行单元测试
        run: |
          pytest config/ src/ -v --tb=short --cov=src --cov=config --cov-report=xml

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  # ============================================
  # 集成测试
  # ============================================
  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-async

      - name: 运行集成测试
        run: |
          pytest tests/integration/ -v --tb=short
        if: hashFiles('tests/integration/') != ''

  # ============================================
  # 文档构建
  # ============================================
  docs:
    name: 文档构建
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装文档工具
        run: |
          pip install mkdocs mkdocs-material pdoc3

      - name: 生成 API 文档
        run: |
          pdoc3 --html -o docs/api src/ config/ --force

      - name: 构建 MkDocs
        run: |
          mkdocs build
        if: hashFiles('mkdocs.yml') != ''

      - name: 上传文档产物
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/

  # ============================================
  # 安全扫描
  # ============================================
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装安全工具
        run: |
          pip install bandit safety pip-audit

      - name: Bandit 代码安全扫描
        run: |
          bandit -r src/ config/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Safety 依赖漏洞扫描
        run: |
          safety check --json > safety-report.json
        continue-on-error: true

      - name: Pip-audit 依赖审计
        run: |
          pip-audit --format json > pip-audit-report.json
        continue-on-error: true

      - name: 上传安全报告
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json

  # ============================================
  # 构建验证
  # ============================================
  build:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建工具
        run: |
          pip install build twine

      - name: 构建分发包
        run: |
          python -m build
        if: hashFiles('pyproject.toml') != ''

      - name: 验证配置文件
        run: |
          python -c "import yaml; yaml.safe_load(open('config/default_config.yaml'))"

      - name: 验证配置模块
        run: |
          python -c "from config.config import ConfigManager; m = ConfigManager.get_instance(); c = m.load(); print('配置验证通过')"

  # ============================================
  # 部署（仅 main 分支）
  # ============================================
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    needs: [lint, test, integration, docs, security, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 部署准备
        run: |
          echo "部署到生产环境..."
          echo "部署步骤需根据实际环境配置"

      # 实际部署步骤根据目标环境定制

version: '3.8'

services:
  agentm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agentm
    ports:
      - "5000:5000"
    volumes:
      - ../agentm_data:/app/agentm_data
      - ../config.yaml:/app/config.yaml:ro
    environment:
      - AGENTM_ENVIRONMENT=production
      - AGENTM_LOG_LEVEL=INFO
      - AGENTM_WEBUI_PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

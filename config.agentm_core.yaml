# AgentM Core Configuration
# 自主 Agent 核心配置文件

server:
  host: 127.0.0.1
  port: 8765
  debug: false
  cors_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

memory:
  chromadb_path: "./data/chroma"
  cache_ttl: 3600  # 秒
  max_memories: 10000
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

scheduler:
  enabled: true
  max_concurrent: 3
  check_interval: 1.0  # 秒

autonomous:
  enabled: true
  reflection_interval: 300  # 秒 (5 分钟)
  max_goals: 10
  task_timeout: 3600  # 秒

event_bus:
  queue_size: 1000
  persistence_path: "./data/events.jsonl"
  retry_attempts: 3
  retry_delay: 1.0  # 秒

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./data/agentm.log"

security:
  api_key: "agentm-secret-key-change-me"  # 生产环境请修改
  token_expiry: 3600  # 秒
